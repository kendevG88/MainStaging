<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./style.css">

    <script type="module"  src="./script.js">
        import Script from './script.js'
    </script>

</head>



<body>
    <div class = "head">
        <h1 class = "page-title"> Tool Admin </h1>

        <div class = "options">
            <button class = "option-button" onclick="Script.setActiveTag(0)">Data Manager</button>
            <button class = "option-button" onclick="Script.setActiveTag(1)">Send Notify</button>
            <button class = "option-button" onclick="Script.setActiveTag(2)">Ads Manager</button>
            <button class = "option-button" onclick="Script.setActiveTag(3)">Setup</button>
            <button class = "option-button" onclick="Script.sendLogOutMess()">Log Out</button>
        </div>

    </div>
    <div class = "container">
        <div class="login-container popup hidden">
            <h2>Admin Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class = "popup-horizontal-button" onclick="Script.login()">Login</button>
        </div>
    
        <div class="admin-controller hidden ">
            <div class="data-manager popup tag0">
                <h2>Data Manager</h2>
                <input type="file" id = "json-data-file-input" class="json-data-file-input" accept=".json">
                <button class = "popup-horizontal-button" onclick="Script.downLoadData()">Download Data</button>
                <button class = "popup-horizontal-button" onclick="Script.upLoadData()">Upload Data</button>
            </div>
            <div class="notification-container popup tag1">
                <h2>Send Notification</h2>
                <textarea class = "document-input" id="notify-input" placeholder="Your message"></textarea>
                <button class = "popup-horizontal-button" onclick="Script.sendNotification()">Send</button>
            </div>
            <div class="ads-manager-container popup tag2">
                <h2>Ads Manager</h2>
            </div>
            <div class="notification-container popup tag3">
                <h2>Setup</h2>
                <p> Setup Chat Bot - User name variable : user_name </p>
                <textarea class = "document-input" id="first-mess-input" placeholder="Say Hello!"></textarea>
                <button class = "popup-horizontal-button" onclick="Script.sendSetupChatBot()">Send</button>
            </div>
        </div>
    
        <div class="notify-popup popup hidden top-layer">
            <h2>Thông báo</h2>
            <p id="notify-content"></p>
            <button class = "popup-horizontal-button" onclick="Script.notifyPopupConfirm()">Xác nhận</button>
        </div>
        
        <div class="verify-popup popup hidden top-layer">
            <h2>Xác nhận</h2>
            <p id="verify-content"></p>
            <button class = "popup-horizontal-button" onclick="Script.verifyPopupCancel()">Cancel</button>
            <button class = "popup-horizontal-button" onclick="Script.verifyPopupConfirm()">Xác nhận</button>
        </div>
    </div>

    
    
</body>

</html>
